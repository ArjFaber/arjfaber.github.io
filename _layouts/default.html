---
layout: default
title: Home
---

{% include base_path %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>{{ page.title }}</title>
  {% include head.html %}
  {% include head/custom.html %}

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      overflow: hidden;
    }

    #intro-video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #main-content {
      display: none;
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .skip-button {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      z-index: 10000;
    }

    .skip-button:hover {
      background-color: rgba(0, 0, 0, 1);
    }

    #background-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      visibility: hidden;
    }

    #main-overlay {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      background: rgba(255, 255, 255, 0);
      color: black;
      padding: 20px;
      z-index: 2;
      overflow-y: auto;
      box-sizing: border-box;
      flex-grow: 1;
    }

    .content-area {
      flex-grow: 1;
      overflow-y: auto;
      width: 100%;
      padding-bottom: 50px;
      z-index: 2;
    }

    h1, p {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .page__footer {
      width: 100%;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0);
      color: black;
      text-align: right;
      z-index: 2;
    }
  </style>
</head>

<body>

  <!-- Video A (Intro Video) -->
  <div id="video-container">
    <video id="intro-video" autoplay muted playsinline>
      <source src="https://arjfaber.github.io/files/timesquare (online-video-cutter.com).mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <button id="skip-button" class="skip-button">Skip</button>
  </div>

  <!-- Main Content with Background Video B -->
  <div id="main-content">
    <!-- Background Video -->
    <video autoplay muted playsinline id="background-video">
      <source id="video-source" src="" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const videoSource = document.getElementById("video-source");
        const backgroundVideo = document.getElementById("background-video");
        const mainOverlay = document.getElementById("main-overlay");
        const path = window.location.pathname;

        const videoFilesAbout = [
          "background_1b.mp4",
          "background_2b.mp4",
          "background_3b.mp4",
          "background_4b.mp4"
        ];

        const videoFiles_YLW = [
          "background_2c.mp4"
        ];

        let fontColor = "black";
        const baseURL = "https://arjfaber.github.io/files/";
        let selectedFile = videoFilesAbout[Math.floor(Math.random() * videoFilesAbout.length)];
        let videoURL = baseURL + selectedFile;

        if (path.includes("/publications/")) {
          selectedFile = videoFiles_YLW[Math.floor(Math.random() * videoFiles_YLW.length)];
          videoURL = baseURL + selectedFile;
        }

        if (path.includes("/teaching") || path.includes("paper-title-number-1") || path.includes("paper-title-number-2")) {
          selectedFile = "projects.mp4";
          videoURL = baseURL + selectedFile;

          if (path.includes("paper-title-number-2")) {
            backgroundVideo.playbackRate = 0.65;
          }
        }

        videoSource.src = videoURL;
        backgroundVideo.load();

        // Apply loop conditionally
        if (selectedFile === "projects.mp4") {
          backgroundVideo.removeAttribute("loop");
        } else {
          backgroundVideo.setAttribute("loop", "");
        }

        if (mainOverlay) {
          mainOverlay.style.color = fontColor;
        }
      });
    </script>

    <div id="main-overlay">
      {% include masthead.html %}
      <div class="content-area">
        {{ content }}
      </div>
      <div class="page__footer">
        <footer>
          {% include footer/custom.html %}
          {% include footer.html %}
        </footer>
      </div>
      {% include scripts.html %}
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const videoContainer = document.getElementById("video-container");
      const mainContent = document.getElementById("main-content");
      const video = document.getElementById("intro-video");
      const skipButton = document.getElementById("skip-button");
      const backgroundVideo = document.getElementById("background-video");

      function goToMainPage() {
        sessionStorage.setItem("seenIntro", "true");
        videoContainer.style.display = "none";
        backgroundVideo.style.visibility = "visible";
        mainContent.style.display = "flex";
      }

      if (sessionStorage.getItem("seenIntro") === "true") {
        goToMainPage();
      } else {
        skipButton.addEventListener("click", goToMainPage);
        video.addEventListener("ended", goToMainPage);
      }

      video.play().catch(error => {
        console.error("Autoplay prevented:", error);
        video.muted = true;
        video.play();
      });
    });
  </script>

</body>
</html>
